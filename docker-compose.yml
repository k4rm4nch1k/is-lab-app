services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: islab-mssql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_PID=Express
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - /opt/backups/mssql:/var/opt/mssql/backup
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${SA_PASSWORD} -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 5s

  app:
    image: ghcr.io/k4rm4nch1k/is-lab-app:latest
    container_name: islab-app
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=mssql;Database=IsLabDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - app-network
    depends_on:
      mssql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge

volumes:
  mssql-data:
    name: islab_mssql_data

