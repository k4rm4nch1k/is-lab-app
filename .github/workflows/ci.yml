name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'
      
      # Найти csproj файл автоматически
      - name: Find csproj file
        id: find_csproj
        run: |
          CSPROJ=$(find . -maxdepth 3 -name "*.csproj" ! -name "*Tests*" | head -1)
          echo "csproj_path=$CSPROJ" >> $GITHUB_OUTPUT
          echo "Found csproj at: $CSPROJ"
      
      - name: Restore dependencies
        run: dotnet restore ${{ steps.find_csproj.outputs.csproj_path }}
      
      - name: Build
        run: dotnet build ${{ steps.find_csproj.outputs.csproj_path }} --no-restore --configuration Release
      
      - name: Test
        run: |
          TEST_PROJECTS=$(find . -name "*Tests*.csproj" -depth 1 2>/dev/null || true)
          if [ -n "$TEST_PROJECTS" ]; then
            dotnet test $TEST_PROJECTS --no-build --configuration Release
          else
            echo "No test projects found, skipping tests"
          fi
      
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
                       -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
      
      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} --all-tags
