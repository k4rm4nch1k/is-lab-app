name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      
      - name: Debug - show structure
        run: |
          echo "Repository structure:"
          tree -L 3 || ls -laR
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      
      - name: Restore dependencies
        run: |
          # Пытаемся восстановить решение или проект
          if [ -f "*.sln" ]; then
            dotnet restore *.sln
          elif [ -f "*.csproj" ]; then
            dotnet restore *.csproj
          elif [ -f "IsLabApp/*.csproj" ]; then
            dotnet restore IsLabApp/*.csproj
          else
            echo "No project file found!"
            exit 1
          fi
      
      - name: Build
        run: |
          if [ -f "*.sln" ]; then
            dotnet build *.sln --configuration Release --no-restore
          elif [ -f "*.csproj" ]; then
            dotnet build *.csproj --configuration Release --no-restore
          elif [ -f "IsLabApp/*.csproj" ]; then
            dotnet build IsLabApp/*.csproj --configuration Release --no-restore
          fi
      
      - name: Test
        run: |
          if [ -d "tests" ]; then
            dotnet test tests/ --configuration Release --no-build --verbosity normal
          elif [ -d "IsLabApp.Tests" ]; then
            dotnet test IsLabApp.Tests/ --configuration Release --no-build --verbosity normal
          else
            echo "No tests found, skipping..."
          fi
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          docker build -t ${{ env.REGISTRY }}/${REPO_NAME}:latest \
                       -t ${{ env.REGISTRY }}/${REPO_NAME}:${SHORT_SHA} .
          
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker push ${{ env.REGISTRY }}/${REPO_NAME} --all-tags
          fi
