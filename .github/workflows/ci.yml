name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  # Приводим имя репозитория к нижнему регистру (важно для GHCR)
  IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}
  IMAGE_NAME_LOWER: ${{ github.repository_owner_lowercase }}/${{ github.event.repository.name_lowercase }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Checkout кода
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup .NET SDK - используем версию 9.0 или 10.0 preview
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'  # Или '10.0.x' если доступно

      # 3. Восстановление зависимостей
      - name: Dotnet restore
        run: dotnet restore

      # 4. Сборка проекта
      - name: Dotnet build
        run: dotnet build --configuration Release --no-restore

      # 5. Запуск тестов
      - name: Dotnet test
        run: dotnet test --configuration Release --no-build --verbosity normal

      # 6. Логин в GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 7. Сборка Docker-образа с правильными тегами
      - name: Build Docker image
        run: |
          # Приводим всё к нижнему регистру
          REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          echo "Building image: ${{ env.REGISTRY }}/${REPO_NAME}:${SHORT_SHA}"
          echo "Also tagging as: ${{ env.REGISTRY }}/${REPO_NAME}:latest"
          
          docker build -t ${{ env.REGISTRY }}/${REPO_NAME}:latest \
                       -t ${{ env.REGISTRY }}/${REPO_NAME}:${SHORT_SHA} .

      # 8. Push образа
      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker push ${{ env.REGISTRY }}/${REPO_NAME} --all-tags

