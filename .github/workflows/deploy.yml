name: CD - Deploy to Server

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "=== Starting deployment on $(hostname) ==="
            echo "Deploy user: $(whoami)"
            echo "Current time: $(date)"
            echo "=== Logging into GitHub Container Registry ==="
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USER }} --password-stdin
            echo "=== Changing to deploy directory ==="
            cd ${{ secrets.DEPLOY_PATH }}
            echo "Current directory: $(pwd)"
            echo "=== Current containers status ==="
            docker compose ps || true
            echo "=== Pulling latest image from GHCR ==="
            docker compose pull
            echo "=== Restarting containers ==="
            docker compose up -d --force-recreate
            echo "=== New containers status ==="
            docker compose ps
            echo "=== Cleaning up old images ==="
            docker image prune -f
            echo "=== Waiting for app to be ready ==="
            sleep 10
            if curl -f http://127.0.0.1:5000/health 2>/dev/null; then
              echo "✅ Application is healthy"
            else
              echo "⚠️ Health check endpoint not responding (may be OK if not configured)"
            fi

            echo "=== Recent logs from app container ==="
            docker compose logs --tail=20 app || true

            echo "=== Deployment completed successfully ==="

